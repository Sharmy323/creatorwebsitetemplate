  <div class="status" id="fst"></div>
</div>

<canvas id="c" width="1600" height="900"></canvas>

<script>
function dlFeat() {
  const status = document.getElementById('fst');
  status.textContent = 'Generating...';
  const svg = document.getElementById('feat');
  const canvas = document.getElementById('c');
  canvas.width = 1600; canvas.height = 900;
  const ctx = canvas.getContext('2d');
  const svgData = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function() {
    ctx.clearRect(0, 0, 1600, 900);
    ctx.drawImage(img, 0, 0, 1600, 900);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(b) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'winback-feature-image.png';
      a.click();
      status.textContent = 'Saved as winback-feature-image.png';
    }, 'image/png');
  };
  img.onerror = function() { status.textContent = 'Error — try Chrome or Firefox.'; };
  img.src = url;
}
function dl(svgId, filename, statusId) {
  const status = document.getElementById(statusId);
  status.textContent = 'Generating...';
  const svg = document.getElementById(svgId);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const svgData = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function() {
    ctx.clearRect(0, 0, 1600, 900);
    ctx.drawImage(img, 0, 0, 1600, 900);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(b) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = filename;
      a.click();
      status.textContent = 'Saved as ' + filename;
    }, 'image/png');
  };
  img.onerror = function() {
    status.textContent = 'Error — try Chrome or Firefox.';
  };
  img.src = url;
}
</script>
</body>
</html>
