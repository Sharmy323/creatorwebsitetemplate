  <text x="260" y="700" fill="#5c6ac4" font-size="13" font-weight="600">Evidence auto-collected</text>
  <text x="260" y="718" fill="#6d7175" font-size="12">Order details, fulfillment data, and delivery confirmations attached automatically for #1042 and #1027</text>
