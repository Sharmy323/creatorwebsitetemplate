  <!-- Card 2: Won -->
  <rect x="465" y="112" width="210" height="100" rx="8" fill="#ffffff" stroke="#e1e3e5" stroke-width="1"/>
  <text x="485" y="142" fill="#6d7175" font-size="12">Won Disputes</text>
  <text x="485" y="185" fill="#008060" font-size="32" font-weight="700">34</text>
