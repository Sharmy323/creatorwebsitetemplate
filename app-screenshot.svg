  <text x="400" y="463" fill="#202223" font-size="13">R. Johnson</text>
  <text x="580" y="463" fill="#202223" font-size="13">$320.00</text>
  <text x="680" y="463" fill="#202223" font-size="13">Credit not processed</text>
