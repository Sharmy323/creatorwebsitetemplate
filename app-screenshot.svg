  <text x="260" y="505" fill="#5c6ac4" font-size="13">#1019</text>
  <text x="400" y="505" fill="#202223" font-size="13">L. Chen</text>
  <text x="580" y="505" fill="#202223" font-size="13">$175.00</text>
